[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "purgekv"
version = "0.1.0"
description = "Layer-streamed KV-cache resume and an append-only SSD KV tier for MLX on Apple Silicon"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
dependencies = ["mlx>=0.32", "mlx-lm>=0.32", "numpy"]
keywords = ["mlx", "apple-silicon", "llm", "kv-cache", "inference"]
classifiers = [
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

[project.optional-dependencies]
dev = ["pytest", "ruff"]
video = ["pillow", "imageio-ffmpeg"]

[project.urls]
Homepage = "https://github.com/PoneeshKumar/purgekv"

[tool.setuptools]
packages = ["purgekv"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["F", "E9"]

[tool.pytest.ini_options]
testpaths = ["tests"]
