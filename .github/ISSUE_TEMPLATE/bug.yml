name: Bug report
description: Something broke or gave a wrong result
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: Include the full error or the output that looked wrong.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: How to reproduce
      placeholder: |
        model: mlx-community/...
        codec: raw / q8
        code or command:
    validations:
      required: true
  - type: input
    id: env
    attributes:
      label: Mac, macOS, mlx and mlx-lm versions
      placeholder: "M4 16 GB, macOS 26.6, mlx 0.32.4, mlx-lm 0.32.2"
    validations:
      required: true
